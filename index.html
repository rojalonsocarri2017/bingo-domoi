<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6b503c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bingo DOMOI">
<title>Bingo DOMOI</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js')
        .catch(error => {
          console.error('Error al registrar el service worker:', error);
        });
    });
  }
</script>
<body>
<div class="texture"></div>
<main class="app">
<section id="home" class="screen home-screen">
<img class="logo" src="logo.png" alt="DOMOI">
<h1>Bienvenidos al bingo DOMOI</h1>
<button id="start" class="primary">Comenzar</button>
</section>
<section id="game" class="screen game-screen hidden">
<header class="game-header"></header>
<img class="game-logo" src="logo.png" alt="DOMOI">
<div class="game-content">
<div class="moment-info">

<p class="label">MOMENTO</p>
<h1 id="phrase">Pulsa para sacar un momento</h1>
<p id="remaining" class="remaining">55 momentos por descubrir</p>
<button id="draw" class="primary">Sacar momento</button>

<div class="secondary-actions">
  <button id="historyBtn" class="secondary-button">
    Ver historial
  </button>

</div>
</div>
<div class="art-card"><div class="art-frame"><div id="art-placeholder" class="art-placeholder">DOMOI</div><img id="art" class="art-img hidden" alt=""></div></div>
</div>
</section>
<section id="historyPanel" class="history-panel hidden">
  <div id="historyOverlay" class="history-overlay"></div>

  <div class="history-card">

    <div class="history-header">
      <div>
        <p class="label">MOMENTOS DESCUBIERTOS</p>
        <h2>Historial</h2>
      </div>

      <button id="closeHistory" class="close-button">
        ×
      </button>
    </div>

    <div id="historyList" class="history-list"></div>

    <p id="emptyHistory" class="empty-history">
      Todavía no ha salido ningún momento.
    </p>

  </div>
</section>

</main>
<script src="app.js"></script>
</body>
</html>
